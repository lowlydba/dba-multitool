name: "SQLCover"
author: "lowlydba"
branding:
  icon: "database"
  color: "purple"
description: "Installs, starts, and stops SQLCover by GoEddie."
inputs:
  sql-instance:
    description: "Target SQL instance."
    required: false
    default: "localhost"
  database:
    description: "Target database."
    required: false
    default: "master"
  output-file:
    description: "File to output results to."
    required: false
    default: "cobertura.xml"
runs:
  using: "composite"
  steps:
    - id: output
      shell: pwsh
      run: |
        $params = @{
          Database = "$env:INPUTS_DATABASE"
          SqlInstance = "$env:INPUTS_SQL_INSTANCE"
          OutputFile = "$env:INPUTS_OUTPUT_FILE"
        }

        ${{github.action_path}}\main.ps1 @params
      env:
        INPUTS_DATABASE: ${{ inputs.database }}
        INPUTS_SQL_INSTANCE: ${{ inputs.sql-instance }}
        INPUTS_OUTPUT_FILE: ${{ inputs.output-file }}
