name: "MSSQL Sample Database"
author: "lowlydba"
branding:
  icon: "database"
  color: "red"
description: "Restores a sample database to an instance."
inputs:
  sql-instance:
    description: "Target SQL instance."
    required: false
    default: "localhost"
  database:
    description: "Sample database to download and restore."
    required: false
    default: "WideWorldImporters"
runs:
  using: "composite"
  steps:
    - shell: pwsh
      id: "mssql-sample-database"
      run: |
        $params = @{
          Database = "$env:INPUTS_DATABASE"
          SqlInstance = "$env:INPUTS_SQL_INSTANCE"
        }

        ${{ github.action_path }}\main.ps1 @params
      env:
        INPUTS_DATABASE: ${{ inputs.database }}
        INPUTS_SQL_INSTANCE: ${{ inputs.sql-instance }}
