---
# https://help.github.com/en/articles/workflow-syntax-for-github-actions

name: Lint Code
on:
  pull_request:
    paths-ignore:
      - install_dba-multitool.sql

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint Code
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false

      - name: Super Linter
        uses: github/super-linter@b807e99ddd37e444d189cfd2c2ca1274d8ae8ef1 # v7
        env:
          LINTER_RULES_PATH: .github/linter-conf
          VALIDATE_MARKDOWN: true
          VALIDATE_POWERSHELL: true
          FILTER_REGEX_EXCLUDE: /github/workspace/*
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: TSQLLint
        uses: lowlydba/tsqllint-action@400444f038229cda4396a595f8353e637f1d8452 # v1.3.2
        with:
          path: "*.sql"
          config: "./.github/linter-conf/.tsqllintrc_150"
          comment: true
          only-changed-files: true

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
